  <text x="55" y="116" class="step">each request includes</text>
  <text x="55" y="138" class="small">protocolVersion</text>
  <text x="55" y="156" class="small">clientCapabilities</text>
  <text x="55" y="174" class="small">clientInfo (SHOULD)</text>
