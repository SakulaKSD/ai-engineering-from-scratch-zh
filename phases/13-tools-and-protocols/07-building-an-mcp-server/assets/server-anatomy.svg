  <text x="620" y="310" text-anchor="middle" class="small">  prompts: {} }</text>

  <rect x="340" y="340" width="560" height="100" class="cool"/>
  <text x="620" y="362" text-anchor="middle" class="step">graduation: FastMCP / TS SDK</text>
